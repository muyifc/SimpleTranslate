name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up Chrome
        # Install a known-good Chrome; the windows-latest image's Chrome
        # fails to launch (--version emits nothing), which breaks the
        # headless browser tests in scripts/package.ps1.
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Verify tag matches manifest version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $manifestVersion = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $manifestVersion) {
            throw "Tag $tag does not match manifest.json version $manifestVersion. Bump manifest.json before tagging."
          }

      - name: Diagnose environment
        shell: pwsh
        run: |
          $chrome = if ($env:CHROME_PATH) { $env:CHROME_PATH } else { "C:\Program Files\Google\Chrome\Application\chrome.exe" }
          Write-Output "::notice::CHROME_PATH: $env:CHROME_PATH"
          if (-not (Test-Path $chrome)) {
            Write-Error "::error::Chrome not found at $chrome"
          } else {
            $v = & $chrome --version 2>&1 | Out-String
            Write-Output "::notice::Chrome: $v"
          }
          Write-Output "::notice::Node: $(node --version)"
          Write-Output "::notice::PS: $($PSVersionTable.PSVersion)"

      - name: Build extension package
        # Runs JS syntax checks, node tests, headless Chrome tests, then
        # produces release/bilingual-web-translation-v<manifest-version>.zip
        shell: pwsh
        run: |
          try {
            ./scripts/package.ps1
          } catch {
            Write-Error "::error::Package build failed: $($_.Exception.Message)"
            throw
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = (Get-ChildItem -Path "release/*.zip").FullName
          if (-not $assets) { throw "No package archive found in release/" }
          gh release create $tag $assets --title $tag --generate-notes
