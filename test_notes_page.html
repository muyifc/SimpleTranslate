<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>notes page test pending</title>
    <link rel="stylesheet" href="options.css">
    <link rel="stylesheet" href="notes.css">
    <script>
      const now = Date.now();
      window.__stored = {readingNotesV1: [
        {id: "older", type: "interpretation", title: "旧解读", url: "javascript:alert(1)", sourceText: "old source", content: "旧内容", createdAt: now - 3000, updatedAt: now - 3000},
        {id: "newest", type: "article-guide", title: "最新导读", url: "https://example.test/newest", sourceText: "", content: "最新内容", createdAt: now - 2000, updatedAt: now - 1000},
        {id: "middle", type: "interpretation", title: "中间解读", url: "https://example.test/middle", sourceText: "middle source", content: "中间内容", createdAt: now - 2500, updatedAt: now - 2000},
      ]};
      window.__opened = [];
      window.confirm = () => true;
      window.open = (...args) => window.__opened.push(args);
      window.chrome = {storage: {local: {
        async get(key) {
          if (window.__failRead) throw new Error("mock notes read failure");
          return {[key]: window.__stored[key]};
        },
        async set(values) {
          if (window.__failWrite) throw new Error("mock notes write failure");
          Object.assign(window.__stored, values);
        },
      }}};
    </script>
  </head>
  <body>
    <header class="page-header">
      <div><p class="eyebrow">双语网页翻译</p><h1>阅读笔记</h1><p>本机保存的划词解读与文章导读。</p></div>
    </header>
    <main class="notes-layout">
      <section class="notes-list-panel" aria-labelledby="notes-list-title">
        <h2 id="notes-list-title">全部笔记</h2>
        <div id="noteList"></div>
      </section>
      <section class="note-detail-panel" aria-labelledby="note-detail-title">
        <h2 id="note-detail-title">笔记详情</h2>
        <div id="noteDetail"></div>
      </section>
    </main>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="notes.js"></script>
    <script>
      const wait = (ms = 20) => new Promise((resolve) => setTimeout(resolve, ms));
      const waitFor = async (check) => {
        for (let attempt = 0; attempt < 50 && !check(); attempt += 1) await wait(10);
      };
      const assert = (condition, message) => { if (!condition) throw new Error(message); };

      (async () => {
        await waitFor(() => document.querySelectorAll("[data-note-id]").length === 3);
        let cards = [...document.querySelectorAll("[data-note-id]")];
        assert(cards.map(({dataset}) => dataset.noteId).join(",") === "newest,middle,older", "笔记未按更新时间倒序排列");
        assert(cards[0].getAttribute("aria-current") === "true", "最新笔记应默认选中");
        assert(document.querySelector("#noteEditor")?.value === "最新内容", "默认详情与选中笔记不一致");

        const sourceLink = document.querySelector("#openSource");
        sourceLink?.addEventListener("click", (event) => event.preventDefault());
        sourceLink?.click();
        assert(window.__opened.at(-1)?.[0] === "https://example.test/newest", "打开原文未使用安全 URL");

        const editor = document.querySelector("#noteEditor");
        const save = document.querySelector('[data-action="save-note"]');
        editor.value = "第一次修改";
        editor.dispatchEvent(new Event("input", {bubbles: true}));
        save.click();
        await wait();
        editor.value = "第二次修改";
        editor.dispatchEvent(new Event("input", {bubbles: true}));
        save.click();
        await wait();
        assert(window.__stored.readingNotesV1.find(({id}) => id === "newest")?.content === "第二次修改", "同一详情应支持连续保存");

        window.__failWrite = true;
        editor.value = "不应写入";
        editor.dispatchEvent(new Event("input", {bubbles: true}));
        save.click();
        await wait();
        assert(window.__stored.readingNotesV1.find(({id}) => id === "newest")?.content === "第二次修改", "写入失败不应覆盖原笔记");
        assert(document.querySelector("#status").textContent.includes("mock notes write failure"), "写入失败应显示错误");
        window.__failWrite = false;

        document.querySelector('[data-note-id="older"]').click();
        assert(document.querySelector("#openSource")?.hidden, "非法 URL 不应显示打开原文");

        while (document.querySelector('[data-action="delete-note"]')) {
          document.querySelector('[data-action="delete-note"]').click();
          await wait();
        }
        cards = [...document.querySelectorAll("[data-note-id]")];
        assert(cards.length === 0, "删除全部笔记后列表应为空");
        assert(document.querySelector("#noteList").textContent.includes("还没有阅读笔记"), "缺少列表空状态");
        assert(document.querySelector("#noteDetail").textContent.includes("选择一条笔记"), "缺少详情空状态");

        document.body.dataset.test = "passed";
        document.title = "notes page test passed";
      })().catch((error) => {
        document.body.dataset.test = "failed";
        document.title = `notes page test failed: ${error.message}`;
      });
    </script>
  </body>
</html>
