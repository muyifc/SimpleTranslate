<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>feature test pending</title>
    <link rel="stylesheet" href="content.css">
    <script>
      window.__messages = [];
      window.__errors = [];
      window.addEventListener("error", (event) => window.__errors.push(event.message));
      window.addEventListener("unhandledrejection", (event) => window.__errors.push(event.reason?.message || String(event.reason)));
      window.__stored = {siteRules: {"": {selector: "#chosen-root"}}};
      window.__storageChanged = [];
      window.__failOnce = true;
      window.IntersectionObserver = class {
        constructor(callback) { this.callback = callback; this.targets = new Set(); window.__viewportObserver = this; }
        observe(target) { this.targets.add(target); if (target.dataset.visible === "true") setTimeout(() => this.callback([{target, isIntersecting: true}]), 10); }
        unobserve(target) { this.targets.delete(target); }
        disconnect() { this.targets.clear(); }
      };
      window.chrome = {
        i18n: {detectLanguage(text, callback) {
          if (window.__invalidateContext) throw new Error("Extension context invalidated.");
          const result = ["when", "Overview"].includes(text)
            ? {isReliable: false, languages: [{language: "cy", percentage: 55}]}
            : {isReliable: true, languages: [{language: "en", percentage: 100}]};
          setTimeout(() => callback(result), text.includes("Delayed") ? 50 : 0);
        }},
        storage: {
          onChanged: {addListener(listener) { window.__storageChanged.push(listener); }},
          local: {
          async get(keys) {
            if (typeof keys === "string") return {[keys]: window.__stored[keys]};
            const names = Array.isArray(keys) ? keys : Object.keys(keys || {});
            return Object.fromEntries(names.map((name) => [name, window.__stored[name]]));
          },
          async set(values) {
            const changes = Object.fromEntries(Object.entries(values).map(([key, newValue]) => [key, {oldValue: window.__stored[key], newValue}]));
            Object.assign(window.__stored, values);
            for (const listener of window.__storageChanged) listener(changes, "local");
          }
        }},
        runtime: {
          lastError: null,
          onMessage: {addListener(listener) { window.__contentListener = listener; }},
          sendMessage(message, callback) {
            window.__messages.push(message);
            if (message.type === "BWT_CANCEL_REQUESTS") return callback({ok: true, cancelled: 0});
            if (message.type === "BWT_INTERPRET_TEXT") {
              return setTimeout(() => callback(message.text.includes("Broken")
                ? {ok: false, error: "mock interpret failure"}
                : {ok: true, interpretation: `通俗解释：${message.text}`}
              ), message.text.includes("Delayed interpretation") ? 80 : 20);
            }
            if (message.type === "BWT_GUIDE_ARTICLE") {
              return setTimeout(() => callback({ok: true, guide: "文章摘要\n这是一篇测试文章。\n\n文章脉络\n1. 背景\n2. 结论\n\n核心观点\n智能体需要检查执行结果。\n\n关键名词\n智能体：自主执行任务的系统。"}), 20);
            }
            const paragraphs = message.paragraphs;
            setTimeout(() => {
              const hasRetry = paragraphs.some(({text}) => text.includes("Retry"));
              if (paragraphs.length > 1 && hasRetry) {
                callback({ok: false, error: "mock batch failure"});
              } else if (hasRetry && window.__failOnce) {
                window.__failOnce = false;
                callback({ok: false, error: "mock failure"});
              } else {
                callback({ok: true, translations: paragraphs.map(({id, text}) => ({id, text: `译文：${text}`}))});
              }
            }, 20);
          }
        }
      };
    </script>
  </head>
  <body>
    <main id="ignored-root"><p data-visible="true">Ignored main text</p></main>
    <article id="chosen-root">
      <h2 id="short-heading" data-visible="true">Overview</h2>
      <p id="first" data-visible="true">First contextual paragraph</p>
      <p id="retry" data-visible="true">Retry this paragraph</p>
    </article>
    <section id="new-root"><p id="new-paragraph" data-visible="true">New selected paragraph</p></section>
    <p id="selection">Selected English words</p>
    <p id="native-selection">智能体是一种自主系统</p>
    <p id="broken-interpretation">Broken interpretation</p>
    <p id="delayed-interpretation">Delayed interpretation</p>
    <p id="short-selection">when</p>
    <p id="delayed-selection">Delayed selected words</p>
    <p id="hover">Hover English words</p>
    <script src="content.js"></script>
    <script>
      const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
      const openMenu = () => document.querySelector(".bwt-floating-button")?.dispatchEvent(new MouseEvent("contextmenu", {bubbles: true, cancelable: true}));

      (async () => {
        const ball = document.querySelector(".bwt-floating-button");
        ball.click();
        await wait(100);

        const initialTexts = window.__messages.filter(({type}) => type === "BWT_TRANSLATE_BATCH").flatMap(({paragraphs}) => paragraphs.map(({text}) => text));
        const savedRootWorked = initialTexts.includes("First contextual paragraph") && !initialTexts.includes("Ignored main text");
        const shortHeadingWorked = initialTexts.includes("Overview") && document.querySelector("#short-heading + .bwt-translation")?.classList.contains("bwt-translation--done");
        const contextualMessage = window.__messages.find((message) => message.paragraphs?.some(({text}) => text === "First contextual paragraph"));
        const contextualParagraph = contextualMessage?.paragraphs.find(({text}) => text === "First contextual paragraph");
        const contextWorked = contextualMessage?.context?.pageTitle === "feature test pending" &&
          contextualMessage.context.previousText === "" &&
          contextualParagraph?.beforeText.includes("Overview") &&
          contextualParagraph?.afterText.includes("Retry this paragraph");

        openMenu();
        document.querySelector('[data-action="article-guide"]')?.click();
        await wait(60);
        const guideMessage = window.__messages.find(({type}) => type === "BWT_GUIDE_ARTICLE");
        const guidePanel = document.querySelector(".bwt-article-guide");
        const articleGuideWorked = guideMessage?.text.includes("Overview") &&
          guideMessage.text.includes("First contextual paragraph") &&
          !guideMessage.text.includes("Ignored main text") &&
          guideMessage.context?.pageTitle === "feature test pending" &&
          !guidePanel?.hidden &&
          getComputedStyle(guidePanel).right === "0px" &&
          ["文章摘要", "文章脉络", "核心观点", "关键名词"].every((heading) =>
            guidePanel?.querySelector(".bwt-article-guide__body")?.textContent.includes(heading)
          );
        guidePanel?.querySelector('[data-action="close-article-guide"]')?.click();
        const articleGuideCloseWorked = guidePanel?.hidden;

        openMenu();
        document.querySelector('[data-action="retry"]')?.click();
        await wait(80);
        const retryWorked = window.__messages.filter((message) => message.paragraphs?.some(({text}) => text === "Retry this paragraph")).length === 3 &&
          document.querySelector("#retry + .bwt-translation")?.classList.contains("bwt-translation--done");

        openMenu();
        document.querySelector('[data-action="clear-region"]')?.click();
        await wait(100);
        const clearRuleWorked = !window.__stored.siteRules?.[""]?.selector &&
          window.__messages.some((message) => message.paragraphs?.some(({text}) => text === "Ignored main text"));

        openMenu();
        document.querySelector('[data-action="select-region"]')?.click();
        await wait(20);
        document.querySelector("#new-root").dispatchEvent(new MouseEvent("mouseover", {bubbles: true}));
        document.querySelector("#new-root").dispatchEvent(new MouseEvent("click", {bubbles: true, cancelable: true}));
        await wait(100);
        const selectedRule = window.__stored.siteRules?.[""]?.selector;
        const regionWorked = selectedRule && document.querySelector(selectedRule) === document.querySelector("#new-root") &&
          window.__messages.some((message) => message.paragraphs?.some(({text}) => text === "New selected paragraph"));

        const recordsBefore = window.__bwtDebug?.recordCount() ?? 0;
        document.querySelector("#chosen-root").remove();
        await wait(350);
        const pruneWorked = (window.__bwtDebug?.recordCount() ?? Infinity) < recordsBefore;

        const scansBefore = window.__bwtDebug?.fullScans?.() ?? 0;
        const dynamicParagraph = document.createElement("p");
        dynamicParagraph.dataset.visible = "true";
        dynamicParagraph.textContent = "Dynamically added paragraph";
        document.querySelector("#new-root").append(dynamicParagraph);
        await wait(350);
        const incrementalWorked = window.__messages.some((message) => message.paragraphs?.some(({text}) => text === "Dynamically added paragraph")) &&
          (window.__bwtDebug?.fullScans?.() ?? Infinity) === scansBefore;

        const range = document.createRange();
        range.selectNodeContents(document.querySelector("#selection"));
        getSelection().removeAllRanges();
        getSelection().addRange(range);
        document.querySelector("#selection").dispatchEvent(new MouseEvent("mouseup", {bubbles: true}));
        await wait(20);
        const translateAction = document.querySelector('[data-action="translate-selection"]');
        const interpretAction = document.querySelector('[data-action="interpret-selection"]');
        const selectionActionsWorked = translateAction?.textContent === "译" && !translateAction.hidden &&
          interpretAction?.textContent === "释" && !interpretAction.hidden &&
          translateAction.style.top === interpretAction.style.top &&
          parseFloat(interpretAction.style.left) > parseFloat(translateAction.style.left);
        translateAction?.click();
        await wait(60);
        const selectionWorked = document.querySelector(".bwt-quick-translation")?.textContent === "译文：Selected English words";
        document.querySelector("#hover").dispatchEvent(new MouseEvent("click", {bubbles: true}));
        getSelection().removeAllRanges();
        getSelection().addRange(range);
        document.querySelector("#selection").dispatchEvent(new MouseEvent("mouseup", {bubbles: true}));
        await wait(20);
        document.querySelector('[data-action="interpret-selection"]')?.click();
        await wait(60);
        const interpretationMessage = window.__messages.find(({type}) => type === "BWT_INTERPRET_TEXT");
        const interpretationWorked = interpretationMessage?.text === "Selected English words" &&
          interpretationMessage?.targetLanguage === "zh-CN" &&
          document.querySelector(".bwt-quick-translation")?.textContent === "通俗解释：Selected English words";
        document.querySelector("#hover").dispatchEvent(new MouseEvent("click", {bubbles: true}));
        const nativeRange = document.createRange();
        nativeRange.selectNodeContents(document.querySelector("#native-selection"));
        getSelection().removeAllRanges();
        getSelection().addRange(nativeRange);
        document.querySelector("#native-selection").dispatchEvent(new MouseEvent("mouseup", {bubbles: true}));
        await wait(20);
        document.querySelector('[data-action="interpret-selection"]')?.click();
        await wait(60);
        const nativeInterpretationWorked = window.__messages.some(({type, text}) =>
          type === "BWT_INTERPRET_TEXT" && text === "智能体是一种自主系统"
        ) && document.querySelector(".bwt-quick-translation")?.textContent === "通俗解释：智能体是一种自主系统";
        document.querySelector("#hover").dispatchEvent(new MouseEvent("click", {bubbles: true}));
        const brokenRange = document.createRange();
        brokenRange.selectNodeContents(document.querySelector("#broken-interpretation"));
        getSelection().removeAllRanges();
        getSelection().addRange(brokenRange);
        document.querySelector("#broken-interpretation").dispatchEvent(new MouseEvent("mouseup", {bubbles: true}));
        await wait(20);
        document.querySelector('[data-action="interpret-selection"]')?.click();
        await wait(60);
        const interpretationErrorWorked = document.querySelector(".bwt-quick-translation")?.textContent === "mock interpret failure";
        document.querySelector("#hover").dispatchEvent(new MouseEvent("click", {bubbles: true}));
        const delayedInterpretationRange = document.createRange();
        delayedInterpretationRange.selectNodeContents(document.querySelector("#delayed-interpretation"));
        getSelection().removeAllRanges();
        getSelection().addRange(delayedInterpretationRange);
        document.querySelector("#delayed-interpretation").dispatchEvent(new MouseEvent("mouseup", {bubbles: true}));
        await wait(20);
        document.querySelector('[data-action="interpret-selection"]')?.click();
        document.dispatchEvent(new KeyboardEvent("keydown", {key: "Escape", bubbles: true}));
        await wait(100);
        const interpretationCancelWorked = document.querySelector(".bwt-quick-translation")?.hidden;
        getSelection().removeAllRanges();
        document.querySelector("#hover").dispatchEvent(new MouseEvent("click", {bubbles: true}));
        await wait(20);
        const clickAwayWorked = document.querySelector(".bwt-selection-action")?.hidden &&
          document.querySelector(".bwt-quick-translation")?.hidden;

        const shortRange = document.createRange();
        shortRange.selectNodeContents(document.querySelector("#short-selection"));
        getSelection().removeAllRanges();
        getSelection().addRange(shortRange);
        document.querySelector("#short-selection").dispatchEvent(new MouseEvent("mouseup", {bubbles: true}));
        await wait(10);
        document.querySelector(".bwt-selection-action")?.click();
        await wait(60);
        const shortSelectionWorked = document.querySelector(".bwt-quick-translation")?.textContent === "译文：when";

        openMenu();
        const selectionMenu = document.querySelector('[data-action="selection-toggle"]');
        const selectionMenuLabelWorked = selectionMenu?.textContent === "禁用划线翻译";
        selectionMenu?.click();
        await wait(10);
        const disabledRange = document.createRange();
        disabledRange.selectNodeContents(document.querySelector("#selection"));
        getSelection().removeAllRanges();
        getSelection().addRange(disabledRange);
        document.querySelector("#selection").dispatchEvent(new MouseEvent("mouseup", {bubbles: true}));
        await wait(10);
        const selectionToggleWorked = window.__stored.selectionTranslationEnabled === false && document.querySelector(".bwt-selection-action")?.hidden;
        openMenu();
        const selectionMenuEnable = document.querySelector('[data-action="selection-toggle"]');
        const selectionMenuEnableLabelWorked = selectionMenuEnable?.textContent === "启用划线翻译";
        selectionMenuEnable?.click();
        await wait(10);

        const delayedRange = document.createRange();
        delayedRange.selectNodeContents(document.querySelector("#delayed-selection"));
        getSelection().removeAllRanges();
        getSelection().addRange(delayedRange);
        document.querySelector("#delayed-selection").dispatchEvent(new MouseEvent("mouseup", {bubbles: true}));
        await wait(10);
        document.querySelector(".bwt-selection-action")?.click();
        document.dispatchEvent(new KeyboardEvent("keydown", {key: "Escape", bubbles: true}));
        await wait(80);
        const quickCancelWorked = !window.__messages.some((message) => message.paragraphs?.some(({text}) => text === "Delayed selected words"));

        history.pushState({}, "", "#new-page");
        document.querySelector("#hover").dispatchEvent(new MouseEvent("mouseover", {bubbles: true, altKey: true}));
        await wait(550);
        const hoverMessage = window.__messages.find((message) => message.paragraphs?.some(({text}) => text === "Hover English words"));
        const hoverWorked = document.querySelector(".bwt-quick-translation")?.textContent === "译文：Hover English words" && hoverMessage?.paragraphs.length === 1 && hoverMessage.context?.previousText === "";

        document.querySelector("#hover").dispatchEvent(new MouseEvent("mouseout", {bubbles: true, relatedTarget: document.body}));
        document.body.dispatchEvent(new MouseEvent("mouseout", {bubbles: true}));
        window.__invalidateContext = true;
        const invalidRange = document.createRange();
        invalidRange.selectNodeContents(document.querySelector("#selection"));
        getSelection().removeAllRanges();
        getSelection().addRange(invalidRange);
        document.querySelector("#selection").dispatchEvent(new MouseEvent("mouseup", {bubbles: true}));
        await wait(10);
        document.querySelector(".bwt-selection-action")?.click();
        await wait(30);
        window.__invalidateContext = false;
        const errorHandlingWorked = window.__errors.length === 0;

        openMenu();
        document.querySelector('[data-action="site-toggle"]')?.click();
        await wait(30);
        const disableWorked = window.__stored.siteRules?.[""]?.disabled === true && ball.dataset.status === "disabled";

        const checks = {savedRootWorked, shortHeadingWorked, contextWorked, articleGuideWorked, articleGuideCloseWorked, retryWorked, clearRuleWorked, regionWorked, pruneWorked, incrementalWorked, selectionActionsWorked, selectionWorked, interpretationWorked, nativeInterpretationWorked, interpretationErrorWorked, interpretationCancelWorked, clickAwayWorked, shortSelectionWorked, selectionMenuLabelWorked, selectionToggleWorked, selectionMenuEnableLabelWorked, quickCancelWorked, hoverWorked, errorHandlingWorked, disableWorked};
        document.body.dataset.test = Object.values(checks).every(Boolean) ? "passed" : "failed";
        document.title = document.body.dataset.test === "passed"
          ? "feature test passed"
          : `feature test failed: ${Object.entries(checks).filter(([, ok]) => !ok).map(([name]) => name).join(",")}`;
      })().catch((error) => {
        document.body.dataset.test = "failed";
        document.title = `feature test failed: ${error.message}`;
      });
    </script>
  </body>
</html>
