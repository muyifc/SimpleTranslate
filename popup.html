<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>双语网页翻译</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="brand">
          <img src="icons/icon-32.png" alt="">
          <div>
            <h1>双语网页翻译</h1>
            <p id="modelSummary">正在读取配置…</p>
          </div>
        </div>
        <button id="openSettings" type="button" class="settings-button">设置</button>
      </header>

      <section class="control-card" aria-label="当前页面快捷设置">
        <label>
          <span><strong>当前网页翻译</strong><small>按可视区域持续翻译正文</small></span>
          <input id="translationEnabled" type="checkbox" role="switch" disabled>
        </label>
        <label>
          <span><strong>显示译文</strong><small>隐藏后仅显示网页原文</small></span>
          <input id="translationsVisible" type="checkbox" role="switch" disabled>
        </label>
        <label>
          <span><strong>显示悬浮球</strong><small>网页右侧的快捷操作入口</small></span>
          <input id="floatingVisible" type="checkbox" role="switch" disabled>
        </label>
        <label>
          <span><strong>划线翻译</strong><small>选中文本后显示快捷翻译按钮</small></span>
          <input id="selectionTranslationEnabled" type="checkbox" role="switch" disabled>
        </label>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
