<!doctype html>
<html data-bwt-content-ready>
  <head>
    <meta charset="utf-8">
    <title>content test pending</title>
    <link rel="stylesheet" href="content.css">
    <script>
      window.__messages = [];
      window.__activeRequests = 0;
      window.__maxActiveRequests = 0;
      window.IntersectionObserver = class {
        constructor(callback) {
          this.callback = callback;
          this.targets = new Set();
          window.__viewportObserver = this;
        }
        observe(target) {
          this.targets.add(target);
          if (target.dataset.visible === "true") {
            setTimeout(() => this.callback([{target, isIntersecting: true}]), 80);
          }
        }
        disconnect() { this.targets.clear(); }
        trigger(target) { this.callback([{target, isIntersecting: true}]); }
      };
      window.chrome ||= {};
      window.chrome.runtime = {
        lastError: null,
        onMessage: {addListener(listener) { window.__contentListener = listener; }},
        sendMessage(message, callback) {
          window.__messages.push(message);
          if (message.type === "BWT_CANCEL_REQUESTS") {
            callback({ok: true, cancelled: window.__activeRequests});
            return;
          }

          window.__activeRequests += 1;
          window.__maxActiveRequests = Math.max(window.__maxActiveRequests, window.__activeRequests);
          const paragraph = message.paragraphs[0];
          setTimeout(() => {
            window.__activeRequests -= 1;
            callback(paragraph.text.includes("Failure")
              ? {ok: false, error: "mock failure"}
              : {ok: true, translations: [{id: paragraph.id, text: `译文：${paragraph.text}`}]});
          }, paragraph.text.includes("Slow") ? 400 : 80);
        }
      };
    </script>
  </head>
  <body>
    <main>
      <p id="paragraph" data-visible="true">Hello <strong>world</strong></p>
      <div id="standalone" data-visible="true">Standalone div text</div>
      <div><p id="nested" data-visible="true">Nested paragraph</p></div>
      <div id="failure" data-visible="true">Failure paragraph</div>
      <div id="controls"><button type="button">Do not translate controls</button></div>
      <div id="below">Slow below viewport</div>
    </main>
    <script src="content.js"></script>
    <script>
      setTimeout(() => {
        let initialVisibleOnly = false;
        let waitingForViewport = false;
        let initialErrorState = false;
        let enteredViewportState = false;
        const floatingButton = document.querySelector(".bwt-floating-button");
        const floatingStyle = floatingButton && getComputedStyle(floatingButton);
        const initialFloatingButton =
          floatingButton?.textContent === "译" &&
          floatingButton.dataset.status === "idle" &&
          floatingButton.getAttribute("aria-label") === "开始按需翻译" &&
          floatingStyle.position === "fixed" &&
          floatingStyle.right === "18px" &&
          floatingStyle.width === "52px" &&
          floatingStyle.height === "52px";
        floatingButton?.click();

        setTimeout(() => {
          waitingForViewport =
            window.__messages.filter((message) => message.type === "BWT_TRANSLATE_BATCH").length === 0 &&
            floatingButton?.textContent === "…" &&
            floatingButton.dataset.status === "translating" &&
            floatingButton.getAttribute("aria-label") === "正在翻译，点击停止";
        }, 60);

        setTimeout(() => {
          const initialBatches = window.__messages.filter((message) => message.type === "BWT_TRANSLATE_BATCH");
          initialVisibleOnly =
            document.querySelectorAll(".bwt-translation--pending").length === 4 &&
            !document.querySelector("#below + .bwt-translation") &&
            initialBatches.length === 3 &&
            floatingButton?.textContent === "…" &&
            floatingButton.dataset.status === "translating";
        }, 110);

        setTimeout(() => {
          initialErrorState = floatingButton?.textContent === "!" && floatingButton.dataset.status === "error";
          window.__viewportObserver?.trigger(document.querySelector("#below"));
          setTimeout(() => {
            enteredViewportState = floatingButton?.textContent === "…" && floatingButton.dataset.status === "translating";
            floatingButton?.click();
          }, 20);
        }, 270);

        setTimeout(() => {
          const translations = [...document.querySelectorAll(".bwt-translation")];
          const batches = window.__messages.filter((message) => message.type === "BWT_TRANSLATE_BATCH");
          const cancellations = window.__messages.filter((message) => message.type === "BWT_CANCEL_REQUESTS");
          const belowTranslation = document.querySelector("#below + .bwt-translation");
          const passed =
            initialFloatingButton &&
            waitingForViewport &&
            initialVisibleOnly &&
            initialErrorState &&
            enteredViewportState &&
            batches.length === 5 &&
            batches.every((message) => message.paragraphs.length === 1) &&
            cancellations.length === 1 &&
            window.__maxActiveRequests <= 3 &&
            translations.filter((node) => node.classList.contains("bwt-translation--done")).length === 3 &&
            translations.filter((node) => node.classList.contains("bwt-translation--error")).length === 1 &&
            belowTranslation?.classList.contains("bwt-translation--cancelled") &&
            belowTranslation.textContent === "已取消翻译" &&
            floatingButton?.textContent === "停" &&
            floatingButton.dataset.status === "cancelled" &&
            floatingButton.getAttribute("aria-label") === "翻译已取消，点击重新开始" &&
            document.querySelector("#paragraph").textContent === "Hello world";
          document.body.dataset.test = passed ? "passed" : "failed";
          document.title = `content test ${document.body.dataset.test}`;
        }, 800);
      });
    </script>
  </body>
</html>
