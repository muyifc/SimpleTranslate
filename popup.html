<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>双语网页翻译</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>双语网页翻译</h1>
      <label>
        API 地址
        <input id="apiUrl" type="url" placeholder="https://api.openai.com/v1/chat/completions">
      </label>
      <label>
        模型
        <input id="model" type="text" placeholder="填写兼容接口的模型名">
      </label>
      <label>
        API Key
        <input id="apiKey" type="password" autocomplete="off" placeholder="保存在本机扩展存储中">
      </label>
      <label>
        术语表
        <textarea id="glossary" rows="3" placeholder="每行一个术语，例如：agent=智能体"></textarea>
      </label>
      <p class="notice">进入可视区域的正文和少量相邻上下文会发送到翻译服务；译文缓存保存在本机。</p>
      <div class="actions">
        <button id="translate" type="button">开始按需翻译</button>
        <button id="cancel" type="button" class="danger">取消翻译</button>
        <button id="hide" type="button" class="secondary">恢复原文</button>
        <button id="show" type="button" class="secondary">显示译文</button>
        <button id="clearCache" type="button" class="secondary">清空缓存</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
